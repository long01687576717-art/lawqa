<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>劳动法知识库问答</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #1a1f35;
    --panel2: #20263f;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #22c55e;
    --law: #4ade80;
    --case: #fbbf24;
    --border: #2a3350;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1c2340 0%, var(--bg) 70%);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 32px);
    gap: 12px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px;
  }

  header h1 { font-size: 20px; letter-spacing: 1px; }
  header .sub { color: var(--muted); font-size: 12.5px; }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .settings-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .settings-btn:hover { color: var(--text); border-color: var(--accent); }

  .settings {
    display: none;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  .settings.open { display: flex; }

  .settings-row { display: flex; gap: 10px; }
  .settings-row input {
    flex: 1;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
  }
  .settings-row input:focus { border-color: var(--accent); }
  .settings-row button {
    background: var(--accent);
    color: #04121b;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    cursor: pointer;
  }
  .settings-row button:hover { background: var(--accent); filter: brightness(1.1); }
  .settings-hint { color: var(--muted); font-size: 12px; line-height: 1.6; }

  .chat {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  .msg { max-width: 90%; }
  .msg.user { align-self: flex-end; }
  .msg.bot { align-self: flex-start; width: 100%; }

  .bubble {
    padding: 12px 14px;
    border-radius: 12px;
    line-height: 1.7;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble { background: var(--accent); color: #04121b; }

  .msg.bot .bubble {
    background: var(--panel2);
    border: 1px solid var(--border);
  }

  .bubble b { color: var(--green); }

  .cards { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

  .card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .card.law { border-left-color: var(--law); }
  .card.case { border-left-color: var(--case); }

  .card .tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .card.law .tag { background: rgba(74, 222, 128, 0.15); color: var(--law); }
  .card.case .tag { background: rgba(251, 191, 36, 0.15); color: var(--case); }

  .card .title { font-weight: 600; margin-bottom: 4px; }
  .card .meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .card a:hover { text-decoration: underline; }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 6px 0 2px;
  }

  .inputbar {
    display: flex;
    gap: 10px;
    background: var(--panel);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  textarea {
    flex: 1;
    resize: none;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    padding: 12px;
    height: 48px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  button {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #04120b;
    background: var(--green);
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s;
  }
  button:hover { background: #4ade80; }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .typing::after {
    content: "…";
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "·"; }
    50% { content: "··"; }
    75% { content: "···"; }
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>⚖️ 劳动法知识库问答</h1>
      <div class="header-right">
        <span class="sub">法条 · 案例 · 智能检索</span>
        <button id="settings-btn" class="settings-btn">⚙ 设置</button>
      </div>
    </header>

    <div class="settings" id="settings">
      <div class="settings-row">
        <input type="password" id="api-key" placeholder="输入你的 DeepSeek API Key（sk-...）" autocomplete="off" />
        <button id="save-key">保存</button>
      </div>
      <div class="settings-hint">Key 仅保存在你的浏览器本地；每次提问时临时发送给后端调用 DeepSeek，后端不保存。可在 platform.deepseek.com 申请。</div>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot">
        <div class="bubble">你好，我是劳动法知识库助手。你可以问我劳动法相关问题，例如：
「公司拖欠工资怎么办？」「试用期最长多久？」「公司没签劳动合同要赔钱吗？」</div>
      </div>
    </div>

    <div class="inputbar">
      <textarea id="input" placeholder="输入你的问题，按 Ctrl+Enter 发送"></textarea>
      <button id="send">发送</button>
    </div>

    <footer>本工具仅供学习参考，不构成法律意见。法条与案例来自公开渠道，请以官方发布为准。</footer>
  </div>

<script>
(() => {
  "use strict";
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  // 设置 / API Key（BYOK：只存在浏览器本地）
  const settings = document.getElementById("settings");
  const settingsBtn = document.getElementById("settings-btn");
  const apiKeyInput = document.getElementById("api-key");
  const saveKeyBtn = document.getElementById("save-key");
  const KEY_STORAGE = "deepseek_api_key";
  let apiKey = localStorage.getItem(KEY_STORAGE) || "";
  apiKeyInput.value = apiKey;

  settingsBtn.addEventListener("click", () => {
    settings.classList.toggle("open");
    if (settings.classList.contains("open")) apiKeyInput.focus();
  });
  saveKeyBtn.addEventListener("click", () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem(KEY_STORAGE, apiKey);
    saveKeyBtn.textContent = "已保存";
    setTimeout(() => (saveKeyBtn.textContent = "保存"), 1500);
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // 极简 markdown：加粗 + 换行
  function fmt(text) {
    return esc(text)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  }

  function addUser(q) {
    const div = document.createElement("div");
    div.className = "msg user";
    div.innerHTML = `<div class="bubble">${esc(q)}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addBot() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.innerHTML = `<div class="bubble typing">正在检索并生成回答</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div.querySelector(".bubble");
  }

  function renderAnswer(bubble, data) {
    bubble.classList.remove("typing");
    let html = `<div class="bubble">${fmt(data.answer || "")}</div>`;

    if (data.laws && data.laws.length) {
      html += `<div class="section-label">📖 相关法条</div><div class="cards">`;
      for (const l of data.laws) {
        html += `<div class="card law">
          <span class="tag">法条</span>
          <div class="title">《${esc(l.law)}》第 ${esc(l.article)} 条</div>
          <div>${esc(l.text)}</div>`;
        if (l.source) html += `<div class="meta" style="margin-top:6px">来源：<a href="${esc(l.source)}" target="_blank">${esc(l.source)}</a></div>`;
        html += `</div>`;
      }
      html += `</div>`;
    }

    if (data.cases && data.cases.length) {
      html += `<div class="section-label">⚖️ 相似案例</div><div class="cards">`;
      for (const c of data.cases) {
        html += `<div class="card case">
          <span class="tag">案例</span>
          <div class="title">${esc(c.title)}</div>
          ${c.case_no ? `<div class="meta">${esc(c.case_no)}${c.court ? " · " + esc(c.court) : ""}</div>` : ""}
          ${c.ruling ? `<div><b>裁判要点：</b>${esc(c.ruling)}</div>` : ""}`;
        if (c.source) html += `<div class="meta" style="margin-top:6px">来源：<a href="${esc(c.source)}" target="_blank">${esc(c.source)}</a></div>`;
        html += `</div>`;
      }
      html += `</div>`;
    }

    bubble.outerHTML = html;
    chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const q = input.value.trim();
    if (!q) return;
    if (!apiKey) {
      alert("请先在「设置」里输入你的 DeepSeek API Key");
      settings.classList.add("open");
      apiKeyInput.focus();
      return;
    }
    addUser(q);
    input.value = "";
    sendBtn.disabled = true;
    const bubble = addBot();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
        body: JSON.stringify({ question: q, top_k: 5 }),
      });
      const data = await res.json();
      if (res.status === 401) {
        bubble.classList.remove("typing");
        bubble.textContent = "⚠️ 请先在「设置」里配置有效的 API Key";
        settings.classList.add("open");
      } else if (!res.ok || data.error) {
        bubble.classList.remove("typing");
        bubble.textContent = "⚠️ " + (data.error || "请求出错，请稍后重试");
      } else {
        renderAnswer(bubble, data);
      }
    } catch (e) {
      bubble.classList.remove("typing");
      bubble.textContent = "⚠️ 请求失败：" + e.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      send();
    }
  });
})();
</script>
</body>
</html>
